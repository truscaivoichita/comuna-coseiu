<header class="main-header">
  <img
    src="assets/images/heart-transp.png"
    alt="Comuna Coșeiu Logo"
    class="logo"
    loading="lazy"
  />

  <div class="top-controls">
    <div class="lang-theme">
      <button id="theme-toggle" aria-label="Toggle dark mode">🖤</button>
      <button id="lang-toggle" aria-label="Language switch">RO</button>
      <button id="backToTop">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>

    <form class="search-form" id="search-form">
      <label for="search-input" class="visually-hidden">Caută</label>
      <input type="text" id="search-input" placeholder="Caută..." />
      <button type="submit">🔍</button>
    </form>

    <button class="menu-toggle" aria-label="Deschide meniul">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <nav aria-label="Main navigation">
    <ul id="main-menu"></ul>
  </nav>
</header>
